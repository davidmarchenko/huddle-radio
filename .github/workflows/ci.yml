name: ci

# Runs on every PR + every push to main. Provider-smoke tests are
# excluded — they require real API keys and we don't want PR runs to
# burn vendor quota or fail when secrets are unavailable on forks.

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-flight run for the same ref. Saves Actions minutes
# and surfaces the most recent commit's status quickly on PRs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (matches local Node 24 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies (npm ci — lockfile-driven)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npm test

      - name: Production build (next build)
        # Catches Next.js-specific compile failures the typecheck
        # alone misses (route bundle splitting, server-only import
        # leaks into client components, etc.).
        run: npm run build

  browser-smoke:
    name: playwright golden-path + video-stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run in parallel with `verify` — both gate merge but neither
    # blocks the other from starting.
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium only — matches playwright.config.ts)
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        # CI=1 makes Playwright pick the github reporter (already
        # configured in playwright.config.ts) and disables
        # reuseExistingServer so the workflow always boots a fresh
        # dev server.
        run: npm run test:browser
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
